<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SIA Studio</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1d212b; --border: #272c38;
    --text: #e6e9ef; --muted: #8b93a7; --accent: #6ea8fe; --good: #4ade80;
    --bad: #f87171; --warn: #fbbf24; --code-bg: #11141a;
    --grid: #272c38; --token-in: #6ea8fe; --token-out: #c792ea;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    /* spacing / radius / elevation tokens so the whole UI scales consistently */
    --r-sm: 6px; --r: 10px; --r-lg: 14px;
    --shadow: 0 10px 28px rgba(0,0,0,.5);
    --skel: linear-gradient(90deg, var(--panel-2) 25%, var(--border) 37%, var(--panel-2) 63%);
    --topbar-h: 0px; /* set at runtime so the gen nav can stick directly under the header */
  }
  /* Light theme: same variable names, persisted via localStorage on <html>. */
  html[data-theme="light"] {
    --bg: #f6f7f9; --panel: #ffffff; --panel-2: #eef1f6; --border: #d7dce5;
    --text: #1b1f29; --muted: #5b6473; --accent: #2563eb; --good: #16a34a;
    --bad: #dc2626; --warn: #b45309; --code-bg: #f0f2f6;
    --grid: #d7dce5; --token-in: #2563eb; --token-out: #7c3aed;
    --shadow: 0 10px 28px rgba(20,30,60,.16);
    --skel: linear-gradient(90deg, var(--panel-2) 25%, #dfe4ee 37%, var(--panel-2) 63%);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
    font-size: 14px; line-height: 1.5; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }

  /* ---- Sidebar ---- */
  .sidebar { border-right: 1px solid var(--border); background: var(--panel);
    display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex;
    align-items: center; justify-content: space-between; gap: 10px; }
  .brand-left { display: flex; align-items: center; gap: 10px; }
  .brand h1 { font-size: 15px; margin: 0; letter-spacing: .5px; }
  .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good);
    box-shadow: 0 0 8px var(--good); }
  .theme-toggle { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--r-sm); width: 30px; height: 30px; cursor: pointer; font-size: 14px;
    line-height: 1; display: flex; align-items: center; justify-content: center; }
  .theme-toggle:hover { border-color: var(--accent); }
  .run-search { padding: 10px 12px 6px; }
  .run-search input { width: 100%; }
  .runlist { padding: 6px 8px 12px; overflow-y: auto; flex: 1; min-height: 0; }
  .run-item { display: block; padding: 10px 12px; border-radius: var(--r); cursor: pointer;
    border: 1px solid transparent; margin-bottom: 4px; }
  .run-item:hover { background: var(--panel-2); text-decoration: none; }
  .run-item.active { background: var(--panel-2); border-color: var(--accent); }
  .run-item .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .run-item .name { font-weight: 600; word-break: break-word; }
  .run-item .sub { color: var(--muted); font-size: 12px; margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidebar-count { color: var(--muted); font-size: 11px; padding: 2px 14px 0;
    text-transform: uppercase; letter-spacing: .5px; }

  /* ---- Main column: scroll container with a sticky header ---- */
  .main { overflow-y: auto; position: relative; }
  .topbar { position: sticky; top: 0; z-index: 30; background: var(--bg);
    border-bottom: 1px solid var(--border); padding: 12px 28px 12px; }
  .crumbs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    font-size: 13px; color: var(--muted); }
  .crumb { color: var(--muted); }
  .crumb.cur { color: var(--text); font-weight: 600; }
  .crumb-sep { color: var(--border); }
  html[data-theme="light"] .crumb-sep { color: var(--muted); }
  .topbar-title { display: flex; align-items: center; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
  .topbar-title h2 { font-size: 19px; margin: 0; }
  .topbar-title .started { color: var(--muted); font-size: 12px; }
  .content { padding: 8px 28px 40px; }

  /* ---- Zone headers ---- */
  .zone-head { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 10px; }
  .zone-head h2 { font-size: 16px; margin: 0; }
  .zone-head .hint { color: var(--muted); font-size: 12px; }
  .zone-head::before { content: ""; }

  /* ---- Badges (shape glyph + text, never colour-only) ---- */
  .badge { font-family: var(--mono); font-size: 12px; padding: 2px 9px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--border); display: inline-flex;
    align-items: center; gap: 5px; white-space: nowrap; }
  .badge .glyph { font-size: 10px; }
  .badge.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 55%, var(--border)); }
  .badge.bad  { color: var(--bad);  border-color: color-mix(in srgb, var(--bad) 55%, var(--border)); }
  .badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 55%, var(--border)); }

  /* ---- Cards / grids ---- */
  .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
    gap: 10px; margin: 4px 0 12px; }
  .meta-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r);
    padding: 9px 12px; }
  .meta-card .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
  .meta-card .v { margin-top: 4px; font-family: var(--mono); font-size: 13px; word-break: break-word; }

  /* ---- Profile cards: key value inline + click-to-expand full detail ---- */
  .profile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
    gap: 10px; margin: 6px 0 4px; align-items: start; }
  .profile-card { background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--r); padding: 10px 14px; }
  .profile-card .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
  .profile-val { font-family: var(--mono); font-size: 13px; margin-top: 4px; word-break: break-word; }
  .link-btn { background: none; border: none; color: var(--accent); cursor: pointer;
    font-size: 12px; padding: 6px 0 0; font-family: var(--sans); }
  .link-btn:hover { text-decoration: underline; }
  .profile-details { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 8px; }
  .kv { display: flex; gap: 10px; align-items: baseline; margin-bottom: 5px; }
  .kv:last-child { margin-bottom: 0; }
  .kv-k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
    min-width: 90px; flex-shrink: 0; }
  .kv-v { font-family: var(--mono); font-size: 12.5px; word-break: break-word; }

  h3 { font-size: 14px; margin: 18px 0 8px; color: var(--muted); }

  /* ---- Telemetry stat cards ---- */
  .tele-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
    gap: 10px; margin: 6px 0 8px; }
  .tele-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r);
    padding: 12px 14px; }
  .tele-card .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
  .tele-card .v { margin-top: 6px; font-family: var(--mono); font-size: 20px; font-weight: 600; }
  .tele-card .sub { color: var(--muted); font-size: 11px; margin-top: 2px; }

  /* ---- Charts / panels ---- */
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r);
    padding: 16px; margin: 8px 0 16px; }
  .panel-title { color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: .6px; margin-bottom: 10px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 0 0 10px; font-size: 12px; color: var(--muted); }
  .legend .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    margin-right: 5px; vertical-align: middle; }

  /* ---- Scheduler timeline ---- */
  .sched-timeline { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
  .sched-cell { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .sched-dot { width: 30px; height: 30px; border-radius: 8px; display: flex;
    align-items: center; justify-content: center; font-family: var(--mono);
    font-size: 13px; font-weight: 700; color: #fff; cursor: default; border: 1px solid var(--border); }
  .sched-dot.harness { background: var(--accent); }
  .sched-dot.weight  { background: var(--token-out); }
  .sched-dot.both    { background: var(--warn); color: #000; }
  .sched-gen { color: var(--muted); font-size: 10px; font-family: var(--mono); }

  /* ---- Sticky generation nav (gen rail + tabs), pinned under the header ---- */
  .gen-nav { position: sticky; top: var(--topbar-h); z-index: 20; background: var(--bg);
    padding: 10px 0 0; margin-top: 6px; }
  .gen-rail-wrap { display: flex; align-items: center; gap: 8px; }
  .gen-rail-label { color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: .6px; flex-shrink: 0; }
  .gen-rail { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scroll-behavior: smooth; }
  .gen-rail::-webkit-scrollbar { height: 6px; }
  .gen-rail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .pill { padding: 6px 12px; border-radius: 999px; cursor: pointer; background: var(--panel);
    border: 1px solid var(--border); color: var(--muted); white-space: nowrap; flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 7px; }
  .pill:hover { color: var(--text); text-decoration: none; }
  .pill.active { color: var(--text); border-color: var(--accent); background: var(--panel-2); }
  .pill .pct { font-family: var(--mono); font-size: 12px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 6px 0 16px;
    flex-wrap: wrap; }
  .tab { padding: 8px 14px; cursor: pointer; border-radius: var(--r-sm) var(--r-sm) 0 0;
    color: var(--muted); border: 1px solid transparent; border-bottom: none; }
  .tab:hover { color: var(--text); text-decoration: none; }
  .tab.active { color: var(--text); background: var(--panel); border-color: var(--border);
    margin-bottom: -1px; }

  /* ---- Code blocks: filename header + copy + wrap toggle ---- */
  .code-wrap { border: 1px solid var(--border); border-radius: var(--r); overflow: hidden;
    margin: 4px 0 16px; }
  .code-head { display: flex; align-items: center; gap: 10px; padding: 7px 12px;
    background: var(--panel); border-bottom: 1px solid var(--border); }
  .code-name { font-family: var(--mono); font-size: 12px; color: var(--muted); flex: 1; }
  .btn-icon { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: 4px 10px; font-size: 12px; cursor: pointer;
    font-family: var(--sans); }
  .btn-icon:hover { border-color: var(--accent); }
  pre { background: var(--code-bg); margin: 0; padding: 14px 16px; overflow-x: auto;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.55; white-space: pre; word-break: normal; }
  pre.wrap { white-space: pre-wrap; word-break: break-word; }
  .t-c { color: #6b7280; font-style: italic; }
  .t-s { color: #a5d6a7; }
  .t-n { color: #f0a868; }
  .t-k { color: #c792ea; }
  .t-b { color: #82aaff; }
  .t-d { color: #ffcb6b; }
  .t-f { color: #82aaff; }
  html[data-theme="light"] .t-c { color: #6a737d; }
  html[data-theme="light"] .t-s { color: #22863a; }
  html[data-theme="light"] .t-n { color: #b76b00; }
  html[data-theme="light"] .t-k { color: #8a3ffc; }
  html[data-theme="light"] .t-b, html[data-theme="light"] .t-f { color: #1f6feb; }
  html[data-theme="light"] .t-d { color: #b08800; }

  /* ---- Tables ---- */
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  td.mono, th.mono { font-family: var(--mono); }
  .ok { color: var(--good); } .no { color: var(--bad); }
  .bar { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); }

  /* ---- Trajectory turns ---- */
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  select, input { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: 6px 10px; font-family: var(--sans); font-size: 13px; }
  .turn { border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 10px; overflow: hidden; }
  .turn .role { padding: 6px 12px; font-family: var(--mono); font-size: 12px;
    text-transform: uppercase; letter-spacing: .5px; }
  .turn.system .role { background: #2a2440; color: #c4b5fd; }
  .turn.user .role { background: #1e2a3a; color: #93c5fd; }
  .turn.assistant .role { background: #1e3329; color: #86efac; }
  .turn.tool .role, .turn.unknown .role { background: var(--panel-2); color: var(--muted); }
  .turn .body { padding: 10px 14px; white-space: pre-wrap; font-family: var(--mono); font-size: 12.5px;
    word-break: break-word; }

  /* ---- Markdown ---- */
  .md h1,.md h2,.md h3 { color: var(--text); }
  .md code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-family: var(--mono); }
  .md ul { padding-left: 22px; }
  .md pre { border: 1px solid var(--border); border-radius: var(--r); margin: 8px 0; }
  .muted { color: var(--muted); }

  /* ---- Unified feedback states ---- */
  .skel-wrap { display: flex; flex-direction: column; gap: 8px; padding: 4px 0; }
  .skel { border-radius: var(--r-sm); background: var(--skel); background-size: 400% 100%;
    animation: shimmer 1.3s ease-in-out infinite; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; text-align: center; padding: 40px 24px; color: var(--muted); }
  .empty-ic { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--muted);
    background: var(--panel); }
  .empty-ic.err { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 55%, var(--border)); }
  .empty-title { color: var(--text); font-weight: 600; }
  .empty-msg { font-size: 13px; max-width: 460px; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-left"><span class="dot"></span><h1>SIA STUDIO</h1></div>
      <button class="theme-toggle" id="themeToggle" type="button" title="Toggle dark / light mode" aria-label="Toggle theme">◐</button>
    </div>
    <div class="run-search"><input id="runFilter" type="search" placeholder="Filter runs…" aria-label="Filter runs" /></div>
    <div class="sidebar-count" id="runCount"></div>
    <div class="runlist" id="runlist"></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
const $ = (sel, el=document) => el.querySelector(sel);
const h = (tag, attrs={}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
};
const api = async (path) => {
  const r = await fetch(path);
  if (!r.ok) throw new Error(`${r.status} ${path}`);
  const ct = r.headers.get("content-type") || "";
  return ct.includes("application/json") ? r.json() : r.text();
};
const fmtPct = (p) => p == null ? "—" : p.toFixed(1) + "%";
const pctClass = (p) => p == null ? "" : p >= 50 ? "good" : p >= 25 ? "warn" : "bad";
const pctGlyph = (p) => p == null ? "·" : p >= 50 ? "▲" : p >= 25 ? "◆" : "▼";
const esc = (s) => (s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmtInt = (n) => n == null ? "—" : Number(n).toLocaleString();
const fmtDuration = (ms) => {
  if (ms == null) return "—";
  if (ms < 1000) return ms + " ms";
  const s = ms / 1000;
  if (s < 60) return s.toFixed(1) + " s";
  const m = Math.floor(s / 60); return `${m}m ${Math.round(s % 60)}s`;
};

// ---- Reusable UI atoms ------------------------------------------------------
// One accuracy badge (shape glyph + text so meaning never relies on colour alone).
function accBadge(p) {
  return h("span", { class: "badge " + pctClass(p) },
    h("span", { class: "glyph" }, pctGlyph(p)), fmtPct(p));
}
// Loading placeholder — used everywhere a panel/tab is fetching.
function skeleton(lines = 3) {
  const widths = [100, 92, 74, 86, 60, 80];
  return h("div", { class: "skel-wrap" },
    Array.from({ length: lines }, (_, i) =>
      h("div", { class: "skel", style: `height:14px;width:${widths[i % widths.length]}%` })));
}
// Consistent empty / error states.
function emptyState(title, msg, icon = "○") {
  return h("div", { class: "empty-state" },
    h("div", { class: "empty-ic" }, icon),
    h("div", { class: "empty-title" }, title),
    msg ? h("div", { class: "empty-msg" }, msg) : null);
}
function errorState(msg) {
  return h("div", { class: "empty-state" },
    h("div", { class: "empty-ic err" }, "!"),
    h("div", { class: "empty-title" }, "Couldn’t load this"),
    h("div", { class: "empty-msg" }, msg));
}
// Copy-to-clipboard button that confirms inline.
function copyBtn(getText) {
  const btn = h("button", { class: "btn-icon", type: "button" }, "Copy");
  btn.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(getText()); btn.textContent = "Copied ✓"; }
    catch { btn.textContent = "Copy failed"; }
    setTimeout(() => { btn.textContent = "Copy"; }, 1300);
  });
  return btn;
}
// Code block with filename header, copy, and a wrap/nowrap toggle.
function codeBlock(rawText, highlightedHtml, filename) {
  const pre = h("pre", highlightedHtml != null ? { html: highlightedHtml } : {}, highlightedHtml == null ? rawText : null);
  const wrapBtn = h("button", { class: "btn-icon", type: "button" }, "Wrap");
  wrapBtn.addEventListener("click", () => {
    const on = pre.classList.toggle("wrap");
    wrapBtn.textContent = on ? "No wrap" : "Wrap";
  });
  return h("div", { class: "code-wrap" },
    h("div", { class: "code-head" },
      h("span", { class: "code-name" }, filename),
      wrapBtn, copyBtn(() => rawText)),
    pre);
}

// ---- Dark / light theme (CSS-only, persisted) -------------------------------
const THEME_KEY = "sia-studio-theme";
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const btn = $("#themeToggle");
  if (btn) btn.textContent = theme === "light" ? "☀" : "☾";
  window.dispatchEvent(new Event("sia-theme")); // let canvas charts repaint
}
function initTheme() {
  const saved = localStorage.getItem(THEME_KEY) || "dark";
  applyTheme(saved);
  const btn = $("#themeToggle");
  if (btn) btn.addEventListener("click", () => {
    const next = (document.documentElement.getAttribute("data-theme") === "light") ? "dark" : "light";
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
  });
}

// Minimal, safe markdown (headings, bold, inline code, lists, hr, code fences).
function md(src) {
  const lines = (src || "").split("\n");
  let out = "", inUl = false, inCode = false;
  const closeUl = () => { if (inUl) { out += "</ul>"; inUl = false; } };
  for (let raw of lines) {
    if (raw.trim().startsWith("```")) {
      if (inCode) { out += "</code></pre>"; inCode = false; }
      else { closeUl(); out += "<pre><code>"; inCode = true; }
      continue;
    }
    if (inCode) { out += esc(raw) + "\n"; continue; }
    let line = esc(raw);
    line = line.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
               .replace(/`([^`]+?)`/g, "<code>$1</code>")
               .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    let m;
    if (/^\s*---+\s*$/.test(raw)) { closeUl(); out += "<hr>"; }
    else if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { closeUl(); const n = m[1].length; out += `<h${n}>${m[2]}</h${n}>`; }
    else if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { if (!inUl) { out += "<ul>"; inUl = true; } out += `<li>${m[1]}</li>`; }
    else if (line.trim() === "") { closeUl(); }
    else { closeUl(); out += `<p>${line}</p>`; }
  }
  closeUl(); if (inCode) out += "</code></pre>";
  return out;
}

// Minimal, dependency-free Python highlighter. Tokenizes with a single sticky
// regex (priority order: comment, triple/quoted string, decorator, number,
// identifier) so spans never overlap or break HTML escaping.
const PY_KW = new Set(("False None True and as assert async await break class continue def del " +
  "elif else except finally for from global if import in is lambda nonlocal not or pass raise " +
  "return try while with yield match case self cls").split(" "));
const PY_BUILTIN = new Set(("print len range int float str list dict set tuple bool bytes open " +
  "enumerate zip map filter sum min max abs round sorted reversed type isinstance issubclass " +
  "hasattr getattr setattr delattr super object property staticmethod classmethod repr format " +
  "any all next iter input vars dir id hash hex oct bin chr ord Exception BaseException " +
  "ValueError KeyError TypeError IndexError RuntimeError StopIteration FileNotFoundError " +
  "NotImplementedError OSError IOError AttributeError ImportError True False None").split(" "));
const PY_TOKEN = new RegExp(
  "(#[^\\n]*)" +                                                            // 1 comment
  "|([rbfuRBFU]{0,3}(?:'''[\\s\\S]*?'''|\"\"\"[\\s\\S]*?\"\"\"))" +          // 2 triple string
  "|([rbfuRBFU]{0,3}(?:\"(?:\\\\.|[^\"\\\\\\n])*\"|'(?:\\\\.|[^'\\\\\\n])*'))" + // 3 string
  "|(@[A-Za-z_][\\w.]*)" +                                                  // 4 decorator
  "|(\\b\\d[\\w.]*\\b)" +                                                   // 5 number
  "|([A-Za-z_]\\w*)" +                                                      // 6 identifier
  "|(\\s+)" +                                                              // 7 whitespace
  "|([^\\s])", "y");                                                        // 8 other

function highlightPython(code) {
  let out = "", pos = 0, afterDef = false;
  const span = (cls, t) => `<span class="t-${cls}">${esc(t)}</span>`;
  while (pos < code.length) {
    PY_TOKEN.lastIndex = pos;
    const m = PY_TOKEN.exec(code);
    if (!m) { out += esc(code[pos]); pos++; continue; }
    const [full, comment, tstr, str, dec, num, ident, ws] = m;
    if (comment != null) { out += span("c", full); afterDef = false; }
    else if (tstr != null || str != null) { out += span("s", full); afterDef = false; }
    else if (dec != null) { out += span("d", full); afterDef = false; }
    else if (num != null) { out += span("n", full); afterDef = false; }
    else if (ident != null) {
      if (PY_KW.has(full)) { out += span("k", full); afterDef = (full === "def" || full === "class"); }
      else if (afterDef) { out += span("f", full); afterDef = false; }
      else if (PY_BUILTIN.has(full)) { out += span("b", full); }
      else { out += esc(full); }
    }
    else if (ws != null) { out += esc(ws); }   // whitespace preserves afterDef
    else { out += esc(full); afterDef = false; }
    pos = PY_TOKEN.lastIndex;
  }
  return out;
}

// ---- Routing (hash) ---------------------------------------------------------
let RUNS = [];
async function boot() {
  initTheme();
  $("#runlist").append(skeleton(5));
  try {
    RUNS = await api("/api/runs");
  } catch (e) {
    $("#runlist").innerHTML = "";
    $("#runlist").append(errorState(esc(e.message)));
    return;
  }
  $("#runFilter").addEventListener("input", renderSidebar);
  renderSidebar();
  window.addEventListener("hashchange", route);
  route();
}

function renderSidebar() {
  const list = $("#runlist");
  const q = ($("#runFilter").value || "").trim().toLowerCase();
  const filtered = q
    ? RUNS.filter(r => (r.name || "").toLowerCase().includes(q)
        || (r.task_model || r.meta_model || "").toLowerCase().includes(q)
        || (r.agent_impl || "").toLowerCase().includes(q))
    : RUNS;
  $("#runCount").textContent = RUNS.length
    ? (q ? `${filtered.length} of ${RUNS.length} runs` : `${RUNS.length} run${RUNS.length === 1 ? "" : "s"}`)
    : "";
  list.innerHTML = "";
  if (!RUNS.length) { list.append(emptyState("No runs yet", "Runs appear here once SIA records one.")); return; }
  if (!filtered.length) { list.append(emptyState("No matches", `Nothing matches “${esc(q)}”.`)); return; }
  for (const r of filtered) {
    list.append(h("a", { class: "run-item", href: `#/${r.name}`, "data-run": r.name },
      h("div", { class: "top" },
        h("span", { class: "name" }, r.name),
        accBadge(r.best_accuracy_percent)),
      h("div", { class: "sub" }, `${r.agent_impl || "?"} · ${r.task_model || r.meta_model || "?"} · ${r.num_generations} gen`)));
  }
  syncSidebarActive();
}

function syncSidebarActive() {
  const active = currentRoute().run;
  for (const item of document.querySelectorAll(".run-item"))
    item.classList.toggle("active", item.getAttribute("data-run") === active);
}

function currentRoute() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  return { run: parts[0], gen: parts[1], tab: parts[2] };
}

// Cache run details and track what's currently mounted so navigation only
// re-renders the part that actually changed (no full-page flicker on tab clicks).
const RUN_CACHE = {};
const VIEW = { crumb: null, header: null, pillsRow: null, railWrap: null, genHost: null, tabsBar: null, genBody: null };
let MOUNTED = { run: null, gen: null, tab: null };

async function route() {
  const { run } = currentRoute();
  syncSidebarActive();
  if (!run) {
    MOUNTED = { run: null, gen: null, tab: null };
    document.title = "SIA Studio";
    $("#main").innerHTML = "";
    $("#main").append(emptyState("Select a run", "Pick a run from the left to explore its self-improvement loop, generations, and trajectories.", "←"));
    return;
  }

  let detail = RUN_CACHE[run];
  if (!detail) {
    if (MOUNTED.run !== run) {
      $("#main").innerHTML = "";
      $("#main").append(h("div", { class: "content" }, skeleton(6)));
    }
    try {
      detail = RUN_CACHE[run] = await api(`/api/runs/${run}`);
    } catch (e) {
      MOUNTED = { run: null, gen: null, tab: null };
      $("#main").innerHTML = "";
      $("#main").append(errorState(`Failed to load ${esc(run)} — ${esc(e.message)}`));
      return;
    }
  }

  if (MOUNTED.run !== run) { renderRun(detail); MOUNTED = { run, gen: null, tab: null }; }
  mountGen(detail);
}

// ---- Sticky breadcrumb / wayfinding -----------------------------------------
// A single breadcrumb element lives in the sticky header and is rewritten on
// every navigation so you always know which run / generation / tab you're in,
// even while scrolling deep inside a long tab. Also drives the document title.
function setCrumb(runName, genName, tabLabel) {
  if (!VIEW.crumb) return;
  VIEW.crumb.innerHTML = "";
  const seg = (txt, href, cur) => href
    ? h("a", { class: "crumb" + (cur ? " cur" : ""), href }, txt)
    : h("span", { class: "crumb" + (cur ? " cur" : "") }, txt);
  const sep = () => h("span", { class: "crumb-sep" }, "›");
  VIEW.crumb.append(seg("runs", "#/", false));
  if (runName) VIEW.crumb.append(sep(), seg(runName, `#/${runName}`, !genName));
  if (genName) VIEW.crumb.append(sep(), seg(genName, null, !tabLabel));
  if (tabLabel) VIEW.crumb.append(sep(), seg(tabLabel, null, true));
  document.title = [genName, runName, "SIA Studio"].filter(Boolean).join(" · ");
}

// Keep the gen nav sticking flush under the header even as the header height
// changes (breadcrumb wrapping, long run names).
function measureHeader() {
  if (!VIEW.header) return;
  document.documentElement.style.setProperty("--topbar-h", VIEW.header.offsetHeight + "px");
}

// Flatten a (possibly nested) object into [dotted-key, value] rows, skipping
// null/empty so the whole profile JSON renders generically — new profile fields
// appear automatically without touching this code.
function flattenRows(obj, prefix = "") {
  const rows = [];
  for (const [k, v] of Object.entries(obj || {})) {
    if (v == null || v === "") continue;
    const key = prefix ? `${prefix}.${k}` : k;
    if (typeof v === "object" && !Array.isArray(v)) rows.push(...flattenRows(v, key));
    else rows.push([key, Array.isArray(v) ? v.join(", ") : String(v)]);
  }
  return rows;
}

// Profile cards (meta / target / task): the key value is always visible inline
// (no hover required), with a click-to-expand "Details" panel that renders the
// full profile JSON inline. Falls back to context.md fields for pre-profiles runs.
function profileCards(run) {
  const p = run.profiles || {};
  const defs = [
    { label: "Meta agent", value: p.meta?.model || p.meta?.name || run.meta_model,
      obj: p.meta || (run.meta_model ? { model: run.meta_model, agent_impl: run.agent_impl } : null) },
    { label: "Target agent", value: p.target?.model || p.target?.name || run.task_model,
      obj: p.target || (run.task_model ? { model: run.task_model } : null) },
    { label: "Task", value: run.task,
      obj: { task: run.task, max_generations: run.max_generations } },
  ].filter(d => d.value != null && d.value !== "");

  const grid = h("div", { class: "profile-grid" });
  defs.forEach((d) => {
    const card = h("div", { class: "profile-card" },
      h("div", { class: "k" }, d.label),
      h("div", { class: "profile-val" }, String(d.value)));
    const rows = flattenRows(d.obj);
    if (rows.length) {
      const details = h("div", { class: "profile-details", style: "display:none" },
        rows.map(([k, v]) => h("div", { class: "kv" },
          h("span", { class: "kv-k" }, k), h("span", { class: "kv-v" }, v))));
      const toggle = h("button", { class: "link-btn", type: "button" }, `Details (${rows.length})`);
      let open = false;
      toggle.addEventListener("click", () => {
        open = !open;
        details.style.display = open ? "" : "none";
        toggle.textContent = open ? "Hide details" : `Details (${rows.length})`;
        measureHeader();
      });
      card.append(toggle, details);
    }
    grid.append(card);
  });
  return grid;
}

// ---- Run view (static chrome: built once per run) ---------------------------
function renderRun(run) {
  const main = $("#main");
  main.innerHTML = "";

  // Sticky header: breadcrumb + run title + best-score badge. Stays pinned.
  VIEW.crumb = h("div", { class: "crumbs" });
  const best = (run.generations || []).reduce((m, g) => {
    const a = g.eval?.accuracy_percent; return a != null && (m == null || a > m) ? a : m;
  }, null);
  VIEW.header = h("div", { class: "topbar" },
    VIEW.crumb,
    h("div", { class: "topbar-title" },
      h("h2", {}, run.name),
      best != null ? accBadge(best) : null,
      run.started ? h("span", { class: "started" }, "Started " + run.started) : null));
  main.append(VIEW.header);
  setCrumb(run.name, null, null);
  new ResizeObserver(measureHeader).observe(VIEW.header);
  requestAnimationFrame(measureHeader);

  const content = h("div", { class: "content" });
  main.append(content);

  // ZONE A — run summary (run-level signals).
  content.append(h("div", { class: "zone-head" },
    h("h2", {}, "Run summary"),
    h("span", { class: "hint" }, "configuration · score & token usage across generations")));

  content.append(profileCards(run));

  const telePanel = h("div", {});
  content.append(telePanel);
  loadTelemetryPanel(run.name, telePanel);

  const metricsHost = h("div", { class: "panel" },
    h("div", { class: "panel-title" }, "Performance vs generation"), skeleton(4));
  content.append(metricsHost);
  loadMetricsChart(run.name, metricsHost, run.generations);

  const schedHost = h("div", { class: "panel" },
    h("div", { class: "panel-title" }, "Scheduler decisions"), skeleton(2));
  content.append(schedHost);
  loadSchedulerTimeline(run.name, schedHost);

  // ZONE B — generations (gen-level). The nav (gen rail + tabs) is sticky under
  // the header. The rail rebuilds on every gen/tab change; the tabs bar persists
  // per generation — so they live in separate child containers of the nav.
  VIEW.pillsRow = h("div", { class: "gen-nav" });
  VIEW.railWrap = h("div", {});
  VIEW.pillsRow.append(VIEW.railWrap);
  VIEW.genHost = h("div", {});
  content.append(VIEW.pillsRow, VIEW.genHost);
}

// ---- Telemetry panel: cumulative tokens / calls / duration ------------------
async function loadTelemetryPanel(runName, host) {
  let tele;
  try { tele = await api(`/api/runs/${runName}/telemetry`); }
  catch { host.innerHTML = ""; return; }
  const c = tele && tele.cumulative ? tele.cumulative : {};
  const hasData = (tele.generations || []).length > 0 &&
    ((c.input_tokens || 0) + (c.output_tokens || 0) + (c.num_api_calls || 0) + (c.num_tool_calls || 0)) > 0;
  host.innerHTML = "";
  if (!hasData) {
    host.append(emptyState("No telemetry yet",
      "Token usage appears here once a generation runs with the native LLM client."));
    return;
  }
  const totalTokens = (c.input_tokens || 0) + (c.output_tokens || 0);
  const cards = [
    ["Total tokens", fmtInt(totalTokens), `${fmtInt(c.input_tokens)} in · ${fmtInt(c.output_tokens)} out`],
    ["API calls", fmtInt(c.num_api_calls), "model turns"],
    ["Tool calls", fmtInt(c.num_tool_calls), "actions taken"],
    ["Duration", fmtDuration(c.duration_ms), `across ${fmtInt(c.generation)} gen`],
  ];
  host.append(h("div", { class: "tele-grid" }, cards.map(([k, v, sub]) =>
    h("div", { class: "tele-card" },
      h("div", { class: "k" }, k),
      h("div", { class: "v" }, v),
      h("div", { class: "sub" }, sub)))));
}

// ---- Run-level scheduler decision timeline ----------------------------------
// A compact horizontal sparkline: one cell per generation that recorded a
// scheduler decision, letter-coded H (harness) / W (weight) / B (both), with a
// tooltip carrying that generation's rationale + efficiencies. Pure file-backed
// — the panel reflects new decisions as generations complete and the user
// refreshes / re-navigates the run.
async function loadSchedulerTimeline(runName, host) {
  let data;
  try { data = await api(`/api/runs/${runName}/scheduler`); }
  catch { host.remove(); return; }   // drop the panel entirely if the endpoint is absent
  host.innerHTML = "";
  host.append(h("div", { class: "panel-title" }, "Scheduler decisions"));

  const decisions = (data && data.decisions) || [];
  if (!decisions.length) {
    host.append(emptyState("No decisions yet",
      "The harness-vs-weight timeline fills in as the closed-loop step runs after each generation."));
    return;
  }

  const fmtEff = (v) => v == null ? "n/a" : Number(v).toFixed(6);
  const letter = { harness: "H", weight: "W", both: "B" };
  const timeline = h("div", { class: "sched-timeline" }, decisions.map(d => {
    const kind = String(d.decision || "").toLowerCase();
    const cls = letter[kind] ? kind : "harness";
    const tip = [
      `gen ${d.generation}: ${d.decision || "—"}`,
      d.recommended_next ? `next: ${d.recommended_next}` : null,
      `harness eff: ${fmtEff(d.harness_efficiency)}`,
      `weight eff: ${fmtEff(d.weight_efficiency)}`,
      d.harness_plateaued != null ? `plateaued: ${d.harness_plateaued ? "yes" : "no"}` : null,
      d.rationale ? `\n${d.rationale}` : null,
    ].filter(Boolean).join("\n");
    return h("div", { class: "sched-cell" },
      h("div", { class: "sched-dot " + cls, title: tip }, letter[kind] || "?"),
      h("div", { class: "sched-gen" }, "g" + d.generation));
  }));
  host.append(timeline);

  // Legend so the H/W/B letters are self-explanatory (readability).
  host.append(h("div", { class: "legend", style: "margin-top:10px" },
    h("span", {}, h("span", { class: "swatch", style: "background:var(--accent)" }), "H · harness"),
    h("span", {}, h("span", { class: "swatch", style: "background:var(--token-out)" }), "W · weight"),
    h("span", {}, h("span", { class: "swatch", style: "background:var(--warn)" }), "B · both")));

  const c = (data && data.counts) || {};
  const parts = [];
  if (c.harness) parts.push(`${c.harness} harness`);
  if (c.weight) parts.push(`${c.weight} weight`);
  if (c.both) parts.push(`${c.both} both`);
  host.append(h("div", { class: "muted", style: "font-size:12px;margin-top:6px" },
    (parts.join(" · ") || "0 decisions") + ` · ${data.total} total`));
}

// ---- Performance-vs-generation chart (score line + token bars) --------------
async function loadMetricsChart(runName, host, fallbackGens) {
  let series;
  try {
    const metrics = await api(`/api/runs/${runName}/metrics`);
    series = metrics.generations || [];
  } catch {
    // Fall back to per-generation eval accuracy when the metrics endpoint is absent.
    series = (fallbackGens || []).map(g => ({ generation: g.index, score: g.eval?.accuracy_percent }));
  }
  host.innerHTML = "";
  host.append(h("div", { class: "panel-title" }, "Performance vs generation"));
  host.append(metricsChart(series));
}

// Dependency-free <canvas> chart: token usage as stacked bars (input + output)
// on a right axis, accuracy as a line+points on a left axis. Redraws on resize
// and theme change by reading CSS custom properties at paint time. X-axis labels
// thin out automatically so dense runs (50+ gens) stay legible.
function metricsChart(series) {
  const valid = (series || []).filter(g => g != null);
  if (!valid.length) return emptyState("No metrics yet", "Score and token usage chart appears after the first evaluated generation.");
  const hasTokens = valid.some(g => g.total_tokens != null);

  const wrap = h("div", {});
  const legend = h("div", { class: "legend" },
    h("span", {}, h("span", { class: "swatch", style: "background:var(--accent)" }), "Score (%)"));
  if (hasTokens) {
    legend.append(h("span", {}, h("span", { class: "swatch", style: "background:var(--token-in)" }), "Input tokens"));
    legend.append(h("span", {}, h("span", { class: "swatch", style: "background:var(--token-out)" }), "Output tokens"));
  }
  wrap.append(legend);

  const canvas = h("canvas", { style: "width:100%;height:200px;display:block" });
  wrap.append(canvas);

  const draw = () => {
    if (!canvas.isConnected) return;  // canvas swapped out by navigation
    const cs = getComputedStyle(document.documentElement);
    const col = (name, fb) => (cs.getPropertyValue(name).trim() || fb);
    const C = {
      text: col("--text", "#e6e9ef"), muted: col("--muted", "#8b93a7"),
      grid: col("--grid", "#272c38"), accent: col("--accent", "#6ea8fe"),
      tin: col("--token-in", "#6ea8fe"), tout: col("--token-out", "#c792ea"),
    };
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.clientWidth || 640, H = 200;
    canvas.width = W * dpr; canvas.height = H * dpr;
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const padL = 38, padR = hasTokens ? 48 : 16, padT = 14, padB = 26;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const n = valid.length;
    const maxTok = Math.max(1, ...valid.map(g => g.total_tokens || 0));
    const slot = plotW / n;
    const barW = Math.min(40, slot * 0.5);
    // Thin x labels so they never overlap: aim for ~1 label per 54px.
    const labelStep = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(plotW / 54))));

    // gridlines + score axis labels (0,50,100)
    ctx.strokeStyle = C.grid; ctx.fillStyle = C.muted; ctx.lineWidth = 1;
    ctx.font = "11px " + cs.getPropertyValue("--mono");
    [0, 50, 100].forEach(p => {
      const y = padT + plotH - (p / 100) * plotH;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
      ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.fillText(p + "%", padL - 6, y);
    });

    // stacked token bars (input bottom, output top)
    if (hasTokens) {
      valid.forEach((g, i) => {
        const cx = padL + slot * (i + 0.5);
        const inTok = g.input_tokens || 0, outTok = g.output_tokens || 0;
        const hIn = (inTok / maxTok) * plotH, hOut = (outTok / maxTok) * plotH;
        const x = cx - barW / 2, base = padT + plotH;
        ctx.fillStyle = C.tin; ctx.fillRect(x, base - hIn, barW, hIn);
        ctx.fillStyle = C.tout; ctx.fillRect(x, base - hIn - hOut, barW, hOut);
      });
      ctx.fillStyle = C.muted; ctx.textAlign = "left"; ctx.textBaseline = "top";
      ctx.fillText(fmtInt(maxTok), W - padR + 4, padT);
      ctx.textBaseline = "bottom";
      ctx.fillText("tok", W - padR + 4, padT + plotH);
    }

    // score line + points
    const sx = (i) => padL + slot * (i + 0.5);
    const sy = (s) => padT + plotH - (Math.max(0, Math.min(100, s)) / 100) * plotH;
    ctx.strokeStyle = C.accent; ctx.lineWidth = 2; ctx.beginPath();
    let started = false;
    valid.forEach((g, i) => {
      if (g.score == null) { started = false; return; }
      const x = sx(i), y = sy(g.score);
      if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
    });
    ctx.stroke();
    valid.forEach((g, i) => {
      const x = sx(i);
      if (g.score != null) {
        ctx.fillStyle = C.accent; ctx.beginPath(); ctx.arc(x, sy(g.score), 4, 0, Math.PI * 2); ctx.fill();
        if (i % labelStep === 0 || i === n - 1) {
          ctx.fillStyle = C.text; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
          ctx.fillText(g.score.toFixed(0) + "%", x, sy(g.score) - 7);
        }
      }
      if (i % labelStep === 0 || i === n - 1) {
        ctx.fillStyle = C.muted; ctx.textAlign = "center"; ctx.textBaseline = "top";
        ctx.fillText("gen " + g.generation, x, padT + plotH + 6);
      }
    });
  };

  // Draw once mounted, and again on resize / theme toggle. The theme listener
  // self-removes when the canvas is detached by navigation (no leak).
  requestAnimationFrame(draw);
  new ResizeObserver(draw).observe(canvas);
  const onTheme = () => { if (canvas.isConnected) requestAnimationFrame(draw); else window.removeEventListener("sia-theme", onTheme); };
  window.addEventListener("sia-theme", onTheme);
  return wrap;
}

// ---- Generation mount: only re-render the bits that changed ------------------
function mountGen(detail) {
  const gens = detail.generations;
  if (!gens.length) {
    VIEW.railWrap.innerHTML = "";
    if (VIEW.tabsBar && VIEW.tabsBar.parentNode) VIEW.tabsBar.remove();
    VIEW.genHost.innerHTML = "";
    VIEW.genHost.append(emptyState("No generations yet", "This run hasn’t produced a generation. It will appear here as the loop runs."));
    setCrumb(detail.name, null, null);
    return;
  }
  const { gen, tab } = currentRoute();
  const activeGen = gens.find(g => g.name === gen) || gens[gens.length - 1];
  const activeTab = tab || "overview";

  // Generation rail: a horizontal scroll strip so 100+ generations stay compact;
  // the active pill is auto-centered into view (wayfinding). Only the rail
  // rebuilds here — the tabs bar is owned by buildGenScaffold and persists.
  VIEW.railWrap.innerHTML = "";
  const rail = h("div", { class: "gen-rail" });
  let activePill = null;
  for (const g of gens) {
    const isActive = g.name === activeGen.name;
    const pill = h("a", {
      class: "pill" + (isActive ? " active" : ""),
      href: `#/${detail.name}/${g.name}/${activeTab}`,
    }, h("span", {}, g.name), h("span", { class: "pct" }, fmtPct(g.eval?.accuracy_percent)));
    if (isActive) activePill = pill;
    rail.append(pill);
  }
  VIEW.railWrap.append(h("div", { class: "gen-rail-wrap" },
    h("span", { class: "gen-rail-label" }, "Generation"), rail));

  if (MOUNTED.gen !== activeGen.name) {
    buildGenScaffold(detail, activeGen);
    MOUNTED.gen = activeGen.name;
    MOUNTED.tab = null;
  }
  if (MOUNTED.tab !== activeTab) {
    showTab(detail, activeGen, activeTab);
    MOUNTED.tab = activeTab;
  }
  if (activePill) activePill.scrollIntoView({ inline: "center", block: "nearest" });
  const tabLabel = (GEN_TABS.find(([id]) => id === activeTab) || [, "Overview"])[1];
  setCrumb(detail.name, activeGen.name, tabLabel);
}

// ---- Generation view --------------------------------------------------------
const GEN_TABS = [
  ["overview", "Overview"], ["code", "Agent code"], ["prompt", "Prompt"],
  ["improvement", "Improvement"], ["scheduler", "Scheduler"], ["trajectories", "Trajectories"], ["logs", "Logs"],
];

// Build the tabs bar + empty body container once per generation. The tabs bar
// is part of the sticky gen nav so only the body swaps (no flicker of the chrome).
function buildGenScaffold(run, gen) {
  VIEW.genHost.innerHTML = "";
  if (VIEW.tabsBar && VIEW.tabsBar.parentNode) VIEW.tabsBar.remove();
  VIEW.tabsBar = h("div", { class: "tabs" }, GEN_TABS.map(([id, label]) =>
    h("a", { class: "tab", "data-tab": id, href: `#/${run.name}/${gen.name}/${id}` }, label)));
  VIEW.pillsRow.append(VIEW.tabsBar);
  VIEW.genBody = h("div", {});
  VIEW.genHost.append(VIEW.genBody);
}

const TAB_RENDERERS = {
  overview: tabOverview, code: tabCode, prompt: tabPrompt,
  improvement: tabImprovement, scheduler: tabScheduler,
  trajectories: tabTrajectories, logs: tabLogs,
};

function showTab(run, gen, tab) {
  for (const el of VIEW.tabsBar.children)
    el.classList.toggle("active", el.getAttribute("data-tab") === tab);
  VIEW.genBody.innerHTML = "";
  (TAB_RENDERERS[tab] || tabOverview)({ run, gen, body: VIEW.genBody });
}

function tabOverview({ gen, body }) {
  const ev = gen.eval;
  if (ev) {
    body.append(h("div", { class: "meta-grid" },
      [["Accuracy", fmtPct(ev.accuracy_percent)], ["Correct", ev.correct], ["Incorrect", ev.incorrect],
       ["Total", ev.total], ["Missing", ev.missing], ["Invalid", ev.invalid]]
      .filter(([,v]) => v != null).map(([k,v]) =>
        h("div", { class: "meta-card" }, h("div", { class: "k" }, k), h("div", { class: "v" }, String(v))))));
  } else {
    body.append(emptyState("No evaluation", "This generation has no evaluation results recorded."));
  }
  if (gen.domains?.length) {
    body.append(h("h3", {}, "By domain"));
    const t = h("table", {}, h("thead", {}, h("tr", {},
      h("th", {}, "Domain"), h("th", {}, "Accuracy"), h("th", {}, "Correct / Total"), h("th", { style:"width:30%" }, ""))));
    const tb = h("tbody", {});
    for (const d of gen.domains) {
      tb.append(h("tr", {},
        h("td", {}, d.domain),
        h("td", { class: "mono " + (d.accuracy_percent>=50?"ok":d.accuracy_percent>=25?"":"no") }, fmtPct(d.accuracy_percent)),
        h("td", { class: "mono" }, `${d.correct} / ${d.total}`),
        h("td", {}, h("div", { class: "bar" }, h("span", { style: `width:${d.accuracy_percent}%` })))));
    }
    t.append(tb); body.append(t);
  } else {
    body.append(h("div", { class: "muted", style: "margin-top:10px;font-size:13px" }, "No per-domain breakdown for this generation."));
  }
}

async function tabCode({ run, gen, body }) {
  if (!gen.artifacts.includes("target_agent")) { body.append(emptyState("No agent code", "target_agent.py wasn’t recorded for this generation.")); return; }
  body.append(skeleton(8));
  try {
    const code = await api(`/api/runs/${run.name}/gens/${gen.name}/artifact/target_agent`);
    body.innerHTML = "";
    body.append(codeBlock(code, highlightPython(code), "target_agent.py"));
  } catch (e) { body.innerHTML = ""; body.append(errorState(esc(e.message))); }
}

async function tabPrompt({ run, gen, body }) {
  const label = gen.artifacts.includes("meta_prompt") ? "meta_prompt"
              : gen.artifacts.includes("feedback_prompt") ? "feedback_prompt" : null;
  if (!label) { body.append(emptyState("No prompt file", "No meta-agent or feedback-agent prompt was recorded here.")); return; }
  body.append(skeleton(6));
  try {
    const text = await api(`/api/runs/${run.name}/gens/${gen.name}/artifact/${label}`);
    body.innerHTML = "";
    body.append(h("div", { class: "toolbar" },
      h("span", { class: "muted" }, label === "meta_prompt" ? "meta_agent_prompt.txt" : "feedback_agent_prompt.txt"),
      copyBtn(() => text)));
    body.append(h("div", { class: "md", html: md(text) }));
  } catch (e) { body.innerHTML = ""; body.append(errorState(esc(e.message))); }
}

async function tabImprovement({ run, gen, body }) {
  if (!gen.artifacts.includes("improvement")) { body.append(emptyState("No improvement plan", "improvement.md typically appears from generation 2 onward.")); return; }
  body.append(skeleton(6));
  try {
    const text = await api(`/api/runs/${run.name}/gens/${gen.name}/artifact/improvement`);
    body.innerHTML = "";
    body.append(h("div", { class: "toolbar" }, h("span", { class: "muted" }, "improvement.md"), copyBtn(() => text)));
    body.append(h("div", { class: "md", html: md(text) }));
  } catch (e) { body.innerHTML = ""; body.append(errorState(esc(e.message))); }
}

// ---- Scheduler Decision + weight-update panel -------------------------------
// Shows the adaptive scheduler's harness-vs-weight decision for this generation
// (with rationale + efficiencies) and, when a weight update ran, its loss
// before→after. Both fetched from the endpoints, with clear empty states.
async function tabScheduler({ run, gen, body }) {
  body.append(skeleton(4));
  let decision = null, weights = null;
  try { decision = await api(`/api/runs/${run.name}/gens/${gen.name}/scheduler`); }
  catch { decision = null; }
  try { weights = await api(`/api/runs/${run.name}/gens/${gen.name}/weights`); }
  catch { weights = null; }
  body.innerHTML = "";

  if (!decision) {
    body.append(emptyState("No scheduler decision",
      "Appears once the closed-loop step runs after this generation’s evaluation."));
    return;
  }

  const d = String(decision.decision || "—");
  const badgeCls = d === "weight" ? "warn" : d === "both" ? "warn" : "good";
  body.append(h("div", { class: "zone-head", style: "margin-top:8px" },
    h("h2", {}, "Scheduler decision"),
    h("span", { class: "badge " + badgeCls }, d.toUpperCase())));

  const fmtEff = (v) => v == null ? "n/a" : Number(v).toFixed(6);
  const cards = [
    ["Decision", d, "harness / weight / both"],
    ["Recommended next", String(decision.recommended_next ?? "—"), "next lever"],
    ["Harness efficiency", fmtEff(decision.harness_efficiency), "score / compute"],
    ["Weight efficiency", fmtEff(decision.weight_efficiency), "score / compute"],
    ["Harness plateaued", decision.harness_plateaued ? "yes" : "no", "plateau signal"],
  ];
  body.append(h("div", { class: "tele-grid" }, cards.map(([k, v, sub]) =>
    h("div", { class: "tele-card" },
      h("div", { class: "k" }, k),
      h("div", { class: "v" }, String(v)),
      h("div", { class: "sub" }, sub)))));

  if (decision.rationale) {
    body.append(h("div", { class: "tele-card", style: "margin-top:10px" },
      h("div", { class: "k" }, "Rationale"),
      h("div", { class: "sub", style: "margin-top:6px;font-size:13px" }, String(decision.rationale))));
  }

  // Weight-update summary (only present on a weight/both decision that ran).
  body.append(h("h3", { style: "margin-top:18px" }, "Weight update"));
  if (!weights) {
    body.append(emptyState("No weight update", "Only runs on a weight/both decision."));
    return;
  }
  const lb = weights.loss_before, la = weights.loss_after;
  const delta = (lb != null && la != null) ? (la - lb) : null;
  const wcards = [
    ["Examples", fmtInt(weights.num_examples), "training pairs"],
    ["Loss before → after",
      `${lb == null ? "—" : Number(lb).toFixed(6)} → ${la == null ? "—" : Number(la).toFixed(6)}`,
      delta == null ? "" : (delta <= 0 ? `Δ ${delta.toFixed(6)} (improved)` : `Δ +${delta.toFixed(6)}`)],
    ["Updated", weights.updated ? "yes" : "no", String(weights.updater || "")],
  ];
  body.append(h("div", { class: "tele-grid" }, wcards.map(([k, v, sub]) =>
    h("div", { class: "tele-card" },
      h("div", { class: "k" }, k),
      h("div", { class: "v" }, String(v)),
      h("div", { class: "sub" }, sub)))));
  if (weights.details) {
    body.append(h("div", { class: "tele-card", style: "margin-top:10px" },
      h("div", { class: "k" }, "Details"),
      h("div", { class: "sub", style: "margin-top:6px;font-size:13px" }, String(weights.details))));
  }
}

async function tabLogs({ run, gen, body }) {
  const which = h("select", {},
    h("option", { value: "stdout_log" }, "target_agent_stdout.log"),
    h("option", { value: "eval_log" }, "evaluation.log"));
  const host = h("div", {});
  let current = "";
  const load = async () => {
    host.innerHTML = "";
    host.append(skeleton(6));
    try { current = await api(`/api/runs/${run.name}/gens/${gen.name}/artifact/${which.value}`); host.innerHTML = ""; host.append(h("pre", {}, current)); }
    catch { current = ""; host.innerHTML = ""; host.append(emptyState("Log not available", "This log file wasn’t recorded for this generation.")); }
  };
  which.addEventListener("change", load);
  body.append(h("div", { class: "toolbar" }, which, copyBtn(() => current)));
  body.append(host);
  load();
}

async function tabTrajectories({ run, gen, body }) {
  if (!gen.trajectories?.length) { body.append(emptyState("No trajectories", "No per-question execution traces were recorded for this generation.")); return; }
  const sel = h("select", {}, gen.trajectories.map(q => h("option", { value: q }, "Question q" + q)));
  const filter = h("input", { type: "search", placeholder: "filter q… e.g. 42", style:"width:140px" });
  const host = h("div", {});
  const load = async () => {
    host.innerHTML = "";
    host.append(skeleton(5));
    try {
      const turns = await api(`/api/runs/${run.name}/gens/${gen.name}/trajectory/${sel.value}`);
      host.innerHTML = "";
      for (const t of turns) {
        const cls = ["system","user","assistant"].includes(t.role) ? t.role : "tool";
        host.append(h("div", { class: "turn " + cls },
          h("div", { class: "role" }, t.role),
          h("div", { class: "body" }, t.text || "(empty)")));
      }
      if (!turns.length) host.append(emptyState("Empty trajectory", "This question produced no turns."));
    } catch (e) { host.innerHTML = ""; host.append(errorState(esc(e.message))); }
  };
  filter.addEventListener("input", () => {
    const v = filter.value.trim();
    for (const opt of sel.options) opt.hidden = v && !opt.value.includes(v);
    const first = [...sel.options].find(o => !o.hidden);
    if (first) { sel.value = first.value; load(); }
  });
  sel.addEventListener("change", load);
  body.append(h("div", { class: "toolbar" },
    h("span", { class:"muted" }, `${gen.trajectories.length} trajectories`), sel, filter,
    gen.has_openhands ? h("span", { class:"badge" }, "openhands available") : null));
  body.append(host);
  load();
}

boot();
</script>
