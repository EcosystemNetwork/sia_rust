[package]
name = "sia"
version = "0.4.0"
edition = "2021"
description = "SIA: Self-Improving AI framework (Rust port)"
license = "MIT"
default-run = "sia"

[[bin]]
name = "sia"
path = "src/bin/sia.rs"

# Differential-parity helper: emits the Rust output for an operation given a JSON
# request on stdin, so scripts/parity_check.py can diff Rust vs Python (issue #29).
[[bin]]
name = "sia-parity"
path = "src/bin/sia_parity.rs"

[lib]
name = "sia"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive", "string"] }
include_dir = "0.7"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
mime_guess = "2"
rig-core = { version = "=0.22.0", optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
], optional = true }
glob = { version = "0.3", optional = true }
# Used by the structured-output rig `Extractor` wrapper (issue #47) to derive
# `JsonSchema` on `Answer`. Pinned to the same major as rig-core 0.22.0's
# dependency (schemars 1.x; cache has 1.2.1).
schemars = { version = "1", optional = true }

# Superradiant credential store (Postgres) + CORS, gated behind `superradiant-db`.
# `query!`-style compile-time macros are deliberately avoided so `cargo build`
# never needs a live DATABASE_URL — only the runtime query API + `migrate!`
# (which embeds the `migrations/` dir at build time) are used.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "macros",
    "migrate",
], optional = true }
aes-gcm = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
rand = { version = "0.8", optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }
# Constant-time comparison for the Superradiant admin token (avoids a timing
# side channel). Tiny, no-std; kept non-optional so the admin endpoints are
# hardened in every build, not just `superradiant-db`.
subtle = "2"

[features]
# Native LLM client (issue #50). Non-default so the published build stays lean.
# Issue #39 adds the native Claude Anthropic Messages API tool-loop, which pulls
# in `reqwest` (blocking HTTP transport) and `glob` (the Glob tool executor).
llm = ["dep:rig-core", "dep:reqwest", "dep:glob", "dep:schemars"]
# Superradiant Postgres-backed credential store + in-process "house" LLM
# competitors + CORS for the Vercel/Railway split. Implies `llm` because house
# competitors run models through the native LLM client.
superradiant-db = [
    "llm",
    "dep:sqlx",
    "dep:aes-gcm",
    "dep:base64",
    "dep:rand",
    "dep:uuid",
    "dep:tower-http",
]

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
criterion = "0.5"

[[bench]]
name = "core"
harness = false

[profile.dev]
opt-level = 0
